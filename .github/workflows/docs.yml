name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check distribution
        shell: pwsh
        run: ./scripts/check-docs.ps1
      - name: Check distribution (Python equivalent)
        run: python3 scripts/check_docs.py
      - name: Verify checker detects regressions
        shell: pwsh
        run: ./scripts/test-check-docs.ps1
